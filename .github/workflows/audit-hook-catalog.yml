name: Audit hook catalog

on:
  push:
    branches:
      - master
      - PGTASA
    paths:
      - 'source/**'
      - 'docs/hooks.csv'
      - 'contrib/audit_hook_catalog.py'
      - '.github/workflows/audit-hook-catalog.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'docs/hooks.csv'
      - 'contrib/audit_hook_catalog.py'
      - '.github/workflows/audit-hook-catalog.yml'

permissions:
  contents: read

jobs:
  audit-hook-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Audit hook catalog
        run: python contrib/audit_hook_catalog.py --strict
