name: Static Analysis

env:
  # Compile in parallel where possible.
  CL: /MP

  # Path to the CMake build directory.
  build: "${{ github.workspace }}/build"

# Triggers the workflow on push or pull request events for all branches.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-analysis:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        # Debug no se analiza: 24 archivos del proyecto llevan /O2 /arch:IA32 por fidelidad con el EXE (x87) y el analisis
        # de MSVC los rechaza junto al /RTC1 de Debug ("compiler errors in files"); Release usa las mismas opciones sin conflicto.
        conf: [Release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project via Conan
        uses: ./.github/actions/conan
        with:
          conf: ${{ matrix.conf }}

      - name: Setup CMake
        shell: cmd
        run: cmake --preset conan-default

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@v0.1.1
        id: analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset
          buildConfiguration: ${{ matrix.conf }}
          # Exclude external libraries from analysis
          ignoredPaths: ${{ github.workspace }}/libs

        # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        # Puede fallar si el repositorio no tiene Code Scanning activado; el resultado queda ademas como artefacto.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.analysis.outputs.sarif }}

      - name: Guardar SARIF como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ matrix.conf }}
          path: ${{ steps.analysis.outputs.sarif }}
          if-no-files-found: warn
